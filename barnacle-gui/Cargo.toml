[package]
name = "barnacle-gui"
version.workspace = true
edition.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
barnacle-lib = { path = "../barnacle-lib" }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
deunicode = "1.6.2"
fluent-i18n = "0.1.0"
heck = "0.5.0"
human-panic = "2.0.4"
iced = { version = "0.14.0", features = ["tokio", "svg", "advanced"] }
iced_aw = { version = "0.13.0", features = ["spinner"], default-features = false }
include_dir = "0.7.4"
parking_lot = "0.12.5"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.28.0"
tokio = { version = "1.50.0", features = ["sync"] }
toml = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["debug"]
debug = ["iced/debug", "iced/hot", "iced/time-travel"]

[build-dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
