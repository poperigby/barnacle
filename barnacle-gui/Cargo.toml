[package]
name = "barnacle-gui"
version.workspace = true
edition.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
barnacle-l10n = { path = "../barnacle-l10n" }
barnacle-lib = { path = "../barnacle-lib" }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "display"] }
deunicode = "1.6.2"
futures = "0.3.34"
heck = "0.5.0"
human-panic = "2.0.8"
iced = { version = "0.14.0", features = ["tokio", "svg", "advanced", "sipper"] }
include_dir = "0.7.4"
parking_lot = "0.12.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sipper = "0.1"
strum = "0.28.0"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["sync"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-rolling-file = { version = "0.1.3", features = ["non-blocking"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["debug"]
debug = ["iced/debug", "iced/hot", "iced/time-travel"]

[build-dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
